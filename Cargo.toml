[package]
name = "github-collector"
version = "0.1.0"
edition = "2024"
description = "The Please Behave GitHub collector"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
httpdate = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["macros", "rt", "signal", "time"] }
url = "2.5.9"

[dev-dependencies]
axum = "=0.8.9"
